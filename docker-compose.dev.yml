version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ipapi-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ipapi
      # Allow local connections without password for dev
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ipapi"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ipapi-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ipapi-hono-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override DB and Redis URLs to use internal container networking
      DATABASE_URL: postgresql://postgres@postgres:5432/ipapi?schema=public
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    ports:
      - "8787:8787"
      - "5555:5555" # Prisma Studio
    volumes:
      - .:/app
      - /app/node_modules # Anonymous volume to prevent host node_modules from conflicting
    tty: true # For interactive output

volumes:
  postgres_dev_data:
